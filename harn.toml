[providers.oauth]
resource = "https://www.googleapis.com/"
authorization_endpoint = "https://accounts.google.com/o/oauth2/v2/auth"
token_endpoint = "https://oauth2.googleapis.com/token"
scopes = "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/documents https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.compose https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/calendar.events.freebusy https://www.googleapis.com/auth/calendar.events"
token_endpoint_auth_method = "none"

[providers.setup]
auth_type = "oauth2"
flow = "browser"
required_scopes = [
  "https://www.googleapis.com/auth/drive.file",
  "https://www.googleapis.com/auth/documents",
  "https://www.googleapis.com/auth/gmail.readonly",
  "https://www.googleapis.com/auth/gmail.compose",
  "https://www.googleapis.com/auth/gmail.send",
  "https://www.googleapis.com/auth/calendar.events.freebusy",
  "https://www.googleapis.com/auth/calendar.events",
]
required_secrets = ["google_workspace/access-token"]

[[providers.setup.credential_environment]]
secret = "google_workspace/access-token"
environment_names = ["GOOGLE_WORKSPACE_ACCESS_TOKEN"]

setup_command = [
  "harn",
  "connect",
  "google_workspace",
  "--client-id",
  "YOUR_GOOGLE_DESKTOP_CLIENT_ID",
]
validation_command = ["harn", "connect", "status", "--connector", "google_workspace", "--json"]

[[providers.setup.health_checks]]
id = "access-token"
kind = "secret"
secret = "google_workspace/access-token"

[providers.setup.recovery]
missing_auth = "Create or find a Google Desktop app client ID, then run `harn connect google_workspace --client-id YOUR_GOOGLE_DESKTOP_CLIENT_ID`."
expired_credentials = "Refresh the OAuth access token and rerun Google Workspace validation."
revoked_credentials = "Reauthorize Google Workspace and replace google_workspace/access-token."
missing_scopes = "Grant only the Drive, Docs, Gmail, and Calendar scopes required by the enabled capabilities."
inaccessible_resource = "Confirm the selected Drive file or folder is visible to the authorized account."
transient_provider_outage = "Retry after Google Workspace APIs and push channels are healthy."

[dependencies]

[connector_contract]
version = 2

[[connector_contract.fixtures]]
provider = "google_workspace"
name = "drive file push notification"
kind = "webhook"
headers = { "x-goog-channel-id" = "chan_123", "x-goog-resource-id" = "resource_123", "x-goog-resource-state" = "update", "x-goog-message-number" = "42", "x-goog-channel-token" = "fixture-token" }
metadata = { channel_token = "fixture-token", binding_id = "google.drive.watch" }
body = ""
expect_type = "event"
expect_kind = "google_workspace.drive.update"
expect_event_count = 1
