[package]
name = "harn-google-workspace-connector"
version = "0.1.1"
description = "Pure-Harn Google Workspace connector for Drive/Docs/Gmail artifacts, webhooks, polling, and outbound API dispatch."
license = "MIT OR Apache-2.0"
repository = "https://github.com/burin-labs/harn-google-workspace-connector"
harn = ">=0.10.70,<0.11"
docs_url = "README.md"
provenance = "https://github.com/burin-labs/harn-google-workspace-connector/releases/tag/v0.1.0"

[exports]
default = "src/lib.harn"

[[providers]]
id = "google_workspace"
connector = { harn = "src/lib.harn" }
capabilities = ["webhook", "oauth", "pagination"]

[providers.service]
name = "Google"
description = "Connects Drive, Docs, Gmail, and Calendar through one Google account."

[[providers.service.operations]]
id = "drive.files.get"
capability = "drive.files.read"
purpose = "Read one Google Drive file."
effect = "read"
environments = ["live"]
evidence = ["current_provider_state"]
redaction = ["error_body"]

[[providers.service.operations]]
id = "drive.files.list"
capability = "drive.files.read"
purpose = "List Google Drive files."
effect = "read"
environments = ["live"]
evidence = ["current_provider_state"]
redaction = ["error_body"]

[[providers.service.operations]]
id = "drive.files.export"
capability = "drive.files.read"
purpose = "Export a Google Drive file."
effect = "read"
environments = ["live"]
evidence = ["current_provider_state"]
redaction = ["response_body", "error_body"]

[[providers.service.operations]]
id = "drive.changes.getStartPageToken"
capability = "drive.changes.read"
purpose = "Start tracking Google Drive changes."
effect = "read"
environments = ["live"]
evidence = ["current_provider_state"]
redaction = ["error_body"]

[[providers.service.operations]]
id = "drive.changes.list"
capability = "drive.changes.read"
purpose = "Read Google Drive changes."
effect = "read"
environments = ["live"]
evidence = ["current_provider_state"]
redaction = ["error_body"]

[[providers.service.operations]]
id = "docs.documents.get"
capability = "docs.documents.read"
purpose = "Read one Google document."
effect = "read"
environments = ["live"]
evidence = ["current_provider_state"]
redaction = ["response_body", "error_body"]

[[providers.service.operations]]
id = "gmail.messages.list"
capability = "gmail.messages.read"
purpose = "List Gmail messages."
effect = "read"
environments = ["live"]
evidence = ["current_provider_state"]
redaction = ["response_body", "error_body"]

[[providers.service.operations]]
id = "gmail.messages.get"
capability = "gmail.messages.read"
purpose = "Read one Gmail message."
effect = "read"
environments = ["live"]
evidence = ["current_provider_state"]
redaction = ["response_body", "error_body"]

[[providers.service.operations]]
id = "gmail.messages.attachments.get"
capability = "gmail.messages.read"
purpose = "Read one Gmail attachment."
effect = "read"
environments = ["live"]
evidence = ["current_provider_state"]
redaction = ["response_body", "error_body"]

[[providers.service.operations]]
id = "calendar.freebusy.query"
capability = "calendar.freebusy.read"
purpose = "Check Google Calendar availability."
effect = "read"
environments = ["live"]
evidence = ["current_provider_state"]
redaction = ["request_body", "response_body", "error_body"]

[[providers.service.operations]]
id = "calendar.events.list"
capability = "calendar.events.read"
purpose = "List Google Calendar events."
effect = "read"
environments = ["live"]
evidence = ["current_provider_state"]
redaction = ["response_body", "error_body"]

[[providers.service.operations]]
id = "calendar.events.get"
capability = "calendar.events.read"
purpose = "Read one Google Calendar event."
effect = "read"
environments = ["live"]
evidence = ["current_provider_state"]
redaction = ["response_body", "error_body"]

[[providers.service.operations]]
id = "gmail.drafts.list"
capability = "gmail.drafts.read"
