effect = "consequential"
environments = ["live"]
evidence = ["user_confirmation"]
reconciliation = "required"
redaction = ["request_body", "response_body", "error_body"]

[[providers.service.operations]]
id = "calendar.events.update"
capability = "calendar.events.write"
purpose = "Update the exact Google Calendar event reviewed by the user."
effect = "consequential"
environments = ["live"]
evidence = ["user_confirmation", "current_provider_state"]
reconciliation = "required"
redaction = ["request_body", "response_body", "error_body"]

[[providers.service.operations]]
id = "calendar.events.delete"
